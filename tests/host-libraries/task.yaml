summary: Check the snap does not inadvertently load libraries from the host

prepare: |
  # a real desktop always has some baseline fonts installed (GNOME/KDE etc
  # pull them in as dependencies), but these are minimal cloud images with
  # none at all - with no font for GTK/Pango to fall back to, we saw emacs
  # abort outright with "No suitable font was found", and in-between states
  # (e.g. only a colour/emoji font, no plain text font) are a known trigger
  # for Pango miscalculating a text layout size, which GDK then refuses to
  # allocate as a native window, producing "Native Windows wider or taller
  # than 32767 pixels are not supported" - install a normal font so this
  # environment isn't artificially font-starved in a way no real user's
  # desktop would be.
  case $SPREAD_SYSTEM in
    centos-*|rockylinux-*)
      dnf install -y xorg-x11-server-Xvfb dejavu-sans-fonts
      ;;
    ubuntu-*)
      apt install -y xvfb fonts-dejavu-core
      ;;
  esac

restore: |
  pkill -x Xvfb 2>/dev/null || true
  pkill -x emacs 2>/dev/null || true
  rm -f /tmp/emacs-batch.log /tmp/emacs-gui.log /tmp/xvfb.log

execute: |
  # the /proc scan itself lives in tests/common/check-no-host-libs.sh (shared
  # with tests/wayland) so it can also be run locally, outside of spread -
  # see that script for why we don't just drive classic-snap-analyzer.
  CHECK=$SPREAD_PATH/tests/common/check-no-host-libs.sh

  FAILED=0

  # 1. -nw --batch: the non-windowed, non-interactive code path
  emacs -nw --batch --eval '(sleep-for 5)' > /tmp/emacs-batch.log 2>&1 &
  EMACS_PID=$!
  sleep 2
  if ! kill -0 $EMACS_PID 2>/dev/null; then
    echo "emacs -nw --batch exited early:"
    cat /tmp/emacs-batch.log
    FAILED=1
  else
    "$CHECK" "-nw --batch" || FAILED=1
  fi
  wait $EMACS_PID 2>/dev/null || true

  # 2. a real GUI frame, under a headless X server. Note: on the pgtk
  # channel GTK will try a Wayland backend first and, with no Wayland
  # compositor present, should fall back to X11 against this Xvfb - if
  # that fallback ever stops working this step will fail loudly rather
  # than silently skip.
  Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
  XVFB_PID=$!
  sleep 1
  DISPLAY=:99 emacs > /tmp/emacs-gui.log 2>&1 &
  EMACS_PID=$!
  sleep 3
  if ! kill -0 $EMACS_PID 2>/dev/null; then
    echo "GUI emacs exited early:"
    cat /tmp/emacs-gui.log
    FAILED=1
  else
    "$CHECK" "GUI frame" || FAILED=1
    # catch things like a missing pixbuf loader breaking icon rendering -
    # these don't crash emacs so the checks above wouldn't otherwise notice
    if grep -qE '\): (Gtk|Gdk|GdkPixbuf)-(WARNING|CRITICAL|ERROR) \*\*:' /tmp/emacs-gui.log; then
      echo "GUI frame: unexpected Gtk/Gdk warnings:"
      grep -E '\): (Gtk|Gdk|GdkPixbuf)-(WARNING|CRITICAL|ERROR) \*\*:' /tmp/emacs-gui.log
      FAILED=1
    fi
  fi
  kill $EMACS_PID 2>/dev/null || true
  kill $XVFB_PID 2>/dev/null || true

  [ $FAILED -eq 0 ]
